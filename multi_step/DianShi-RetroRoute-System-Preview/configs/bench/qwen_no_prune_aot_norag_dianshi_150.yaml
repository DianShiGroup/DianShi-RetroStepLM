# Qwen + no-RAG 单步 + AOT* apply gate / dianshi_150
# Planner / single-step no-RAG endpoints: fill in your own below.
#
#   bash scripts/bench/qwen_no_prune_aot_norag_dianshi_150.sh

run:
  input: data/test_data/xuli/dianshi_150/final_product_routes_merged_root_smiles_dedup_longest_495_exclude_WanJRxn_Train_0314_exact_products_depth_max_ge_7_clean.txt
  output: results/bench/dianshi_150/qwen35_397b_norag_rdchiral_aot.jsonl
  log_file: results/bench/dianshi_150/qwen35_397b_norag_rdchiral_aot.log
  concurrency: 6
  resume: true

starting_molecules: "${STARTING_MOLECULES:-./data/Purchasable_stocks/sqlite/emolecules_standardized.sqlite}"

search:
  max_steps: 500
  max_tree_depth: 100
  target_complete_paths: 1
  reach_max_depth_prune: true

planner:
  default_model: "h-qwen/qwen3.5-397b"
  system_prompt: "runtime/prompts/planner_system_v2.md"


llm_config:
  providers:
    h-qwen:
      base_url: "${PLANNER_BASE_URL:-http://127.0.0.1:8099/v1}"
      api_key: "$PLANNER_API_KEY"
      temperature: 0.0
      max_tokens: 32768
      timeout: 300
      llms:
        qwen3.5-397b:
          model_name: "qwen3.5-397b"

single_step:
  rag_enabled: false
  atomwise: true
  max_tokens: 2048
  api_key: "$SINGLE_STEP_API_KEY"
  temperature: 0.0
  timeout: 300
  prompt_path_no_rag: "runtime/single_step/prompts/single_step_prompt_no_rag.txt"
  forward_filter:
    enabled: false
  template_filter:
    enabled: true
    backend: rdchiral
    match_mode: apply
    template_path: "$WANJ_RDCHIRAL_TEMPLATE_JSONL"  # from the runtime-assets bundle
    apply_max_templates: 256
    blurry: true
    blurry_top_n: 1000
    ranking: aot
    unsolved_penalty: 0.1
  retro:
    backend: "dianshi"
    api_url: "${SINGLE_STEP_API_URL:-http://127.0.0.1:10120/v1/chat/completions}"
    model: "qwen3-4b"
    num_res: 10
