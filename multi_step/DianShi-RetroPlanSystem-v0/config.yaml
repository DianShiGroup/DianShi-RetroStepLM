# Global defaults for the bench. Lane yamls under configs/bench/ are
# self-contained and override this file wholesale when passed via --config.
# Environment-specific values (endpoints, keys, asset paths) resolve through
# the environment: $VAR / ${VAR:-default}. A repo-root .env (see
# .env.example) is loaded automatically.

starting_molecules: "${STARTING_MOLECULES:-./DianShi-RetroPlanSystem-Assets/stock/emolecules_standardized.sqlite}"

# Search parameters defaults
search:
  max_steps: 500
  max_tree_depth: 100
  target_complete_paths: 1
  reach_max_depth_prune: true

planner:
  default_model: "h-qwen/qwen3.5-397b"
  system_prompt: "runtime/prompts/planner_system_v2.md"


llm_config:
  providers:
    h-qwen:
      base_url: "${PLANNER_BASE_URL:-http://127.0.0.1:8099/v1}"
      api_key: "$PLANNER_API_KEY"
      temperature: 0.0
      max_tokens: 32768
      timeout: 300
      llms:
        qwen3.5-397b:
          model_name: "qwen3.5-397b"

single_step:
  rag_enabled: false  # ChemRAG retrieval is not part of this release
  atomwise: true
  max_tokens: 2048
  api_key: "$SINGLE_STEP_API_KEY"
  temperature: 0.0
  timeout: 300
  prompt_path_no_rag: "runtime/single_step/prompts/single_step_prompt_no_rag.txt"
  forward_filter:
    enabled: false
  template_filter:
    enabled: false
    backend: rdchiral
    # exact: extract template and look it up. apply: AOT* rewrite (needs backend: rdchiral and the jsonl library).
    match_mode: apply
    template_path: "$DIANSHI_RDCHIRAL_TEMPLATE_JSONL"
    mapper_timeout: 60
    apply_max_templates: 256
    blurry: true
    blurry_top_n: 1000
    ranking: aot
    unsolved_penalty: 0.1
  retro:
    backend: "dianshi"
    api_url: "${SINGLE_STEP_API_URL:-http://127.0.0.1:8001/v1/chat/completions}"
    model: "qwen3-4b"
    num_res: 10
