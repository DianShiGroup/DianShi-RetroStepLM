# DianShi-Direct: the single-step retrosynthesis model served behind an
# OpenAI-compatible /v1/chat/completions API. No retrieval — the model answers
# from its parameters alone — and the rdchiral/AOT* template gate filters and
# reranks whatever it answers.
#
# The gate is ON here because that is the configuration the released numbers
# were produced with: a direct step model (no retrieval) plus the rdchiral/AOT*
# gate. Turning the gate off removes filtering and reranking, which is not the
# reported setting.
#
# Assets (set in .env, see .env.example):
#   SINGLE_STEP_BASE_URL               OpenAI-compatible endpoint, must include the /v1 suffix
#   SINGLE_STEP_MODEL                  name the served step model is registered under
#   SINGLE_STEP_API_KEY               optional bearer token for the endpoint
#   WANJ_RDCHIRAL_TEMPLATE_JSONL      rdchiral template library (required by the gate)
#   STARTING_MOLECULES                building-block stock sqlite (required by the gate)
#   SCSCORE_WEIGHTS                   optional; defaults to the bundled checkpoint
backend: dianshi_direct
atomwise: true
max_tokens: 2048
api_key: ${SINGLE_STEP_API_KEY:-}
temperature: 0.0
timeout: 600
prompt_path_no_rag: inference/prompts/single_step_prompt_no_rag.txt
template_filter:
  enabled: true
  backend: rdchiral
  match_mode: apply
  template_path: ${WANJ_RDCHIRAL_TEMPLATE_JSONL}
  mapper_timeout: 60
  apply_max_templates: 256
  blurry: true
  blurry_top_n: 1000
  ranking: aot
  unsolved_penalty: 0.1
  starting_molecules: ${STARTING_MOLECULES}
retro:
  api_url:
    - ${SINGLE_STEP_BASE_URL:-http://127.0.0.1:8001/v1}/chat/completions
  model: ${SINGLE_STEP_MODEL:-qwen3-4b}
  num_res: 10