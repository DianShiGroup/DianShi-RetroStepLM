[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dianshi-retrostep"
version = "0.1.0"
description = "DianShi-RetroStep evaluation dataset building, vLLM beam-search inference, and Top-k evaluation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "datasets==3.6.0",
    "numpy==1.26.4",
    "ray==2.54.0",
    "rdkit==2025.9.5",
    "torch==2.9.1",
    "tqdm==4.67.3",
    "vllm==0.16.0",
]

[project.scripts]
dianshi-build-tests = "dianshi_retrostep.data.build_model_tests:main"
dianshi-infer = "dianshi_retrostep.inference.vllm_beamsearch_infer:main"
dianshi-eval = "dianshi_retrostep.evaluation.eval_retro_beam_topk:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dianshi_retrostep = ["prompts/*.txt"]
